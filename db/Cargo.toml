[package]
name = "db"
version = "0.1.0"
authors = ["Dustin Speckhals <dustin1114@gmail.com>"]
edition = "2024"

[dependencies]
diesel = { version = "2.3.13", default-features = false, features = ["sqlite", "r2d2"] }
libsqlite3-sys = { version = ">=0.30.1,<0.39.0", default-features = false, features = ["bundled"] }
diesel_migrations = "2.3.2"
env_logger = "0.11.11"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
